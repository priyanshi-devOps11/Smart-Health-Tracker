name: smart_health_tracker
description: A modern Smart Health Tracker Flutter app with step, water, sleep, and BMI tracking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # -------------------------
  # UI & Design
  # -------------------------
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  intl: ^0.19.0

  # -------------------------
  # Animations & Effects
  # -------------------------
  animations: ^2.0.11

  # -------------------------
  # Local Storage
  # -------------------------
  shared_preferences: ^2.2.2

  # -------------------------
  # Sensors & Health Tracking
  # -------------------------
  pedometer: ^4.0.1
  permission_handler: ^11.3.0

  # -------------------------
  # Notifications & Scheduling
  # -------------------------
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # -------------------------
  # Firebase (Optional but Ready)
  # -------------------------
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.7
  cloud_firestore: ^4.15.8
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  camera: ^0.10.5+2

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  #assets:
   # - assets/images/
